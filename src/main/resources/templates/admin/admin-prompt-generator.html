<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Admin · Prompt Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- Header -->
<th:block
        th:with="
            lang='en',
            categories=${null},
            activeCategory=${null}
        ">
    <div th:replace="~{fragments/header :: header}"></div>
</th:block>

<div class="d-flex">

    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

    <!-- Main Content -->
    <div class="flex-fill p-5">

        <br>
        <br>
        <br>
        <br>
        <br>

        <h1 class="hero-title mb-2">AI Authority Prompt Generator</h1>
        <p class="text-secondary mb-4">
            Generate structured high-authority prompts using system-level control.
        </p>

        <!-- FORM -->
        <form th:action="@{/admin/prompt-generator}"
              th:object="${promptRequest}"
              method="post"
              class="card shadow-sm p-4 mb-5">

            <div class="row g-4">

                <!-- Topic -->
                <div class="col-md-6">
                    <label class="form-label">Topic</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{topic}"
                           required>
                </div>

                <!-- Primary Keyword -->
                <div class="col-md-6">
                    <label class="form-label">Primary Keyword</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{primaryKeyword}"
                           required>
                </div>

                <!-- Category -->
                <div class="col-md-6">
                    <label class="form-label">Category</label>
                    <select class="form-select"
                            th:field="*{category}"
                            required>

                        <option value="">-- Select Category --</option>

                        <option value="Learn AI">Learn AI</option>

                        <option value="AI Tools">AI Tools</option>

                        <option value="AI at Work">AI at Work</option>

                        <option value="AI by Industry">AI by Industry</option>

                        <option value="AI Future">AI Future</option>

                        <option value="AI News">AI News</option>

                    </select>
                </div>

                <!-- Length -->
                <div class="col-md-6">
                    <label class="form-label">Length</label>
                    <select class="form-select"
                            th:field="*{length}">
                        <option value="700-1000">700–1000 words</option>
                        <option value="1200-1500">1200–1500 words</option>
                        <option value="2000-2500">2000–2500 words</option>
                    </select>
                </div>

                <!-- Structure -->
                <div class="col-md-6">
                    <label class="form-label">Structure</label>
                    <select class="form-select"
                            th:field="*{structure}">
                        <option value="Scenario → Problem → Framework → Application → Close">
                            Scenario → Problem → Framework → Application → Close
                        </option>
                        <option value="Myth → Reality → Breakdown → Lesson">
                            Myth → Reality → Breakdown → Lesson
                        </option>
                        <option value="Question → Example → Structure → Insight">
                            Question → Example → Structure → Insight
                        </option>
                        <option value="Personal Story → Mistake → System → Advice">
                            Personal Story → Mistake → System → Advice
                        </option>
                        <option value="Bold Statement → Context → Strategy → Use Case">
                            Bold Statement → Context → Strategy → Use Case
                        </option>
                        <option value="Observation → Hidden Friction → Mental Model → System Upgrade → Strategic Shift">
                            Observation → Hidden Friction → Mental Model → System Upgrade → Strategic Shift
                        </option>

                        <option value="Surface Trend → Deeper Layer → Structural Breakdown → Practical Reframe">
                            Surface Trend → Deeper Layer → Structural Breakdown → Practical Reframe
                        </option>

                        <option value="Assumption → Contradiction → Technical Clarification → Operational Reality">
                            Assumption → Contradiction → Technical Clarification → Operational Reality
                        </option>

                        <option value="Capability → Constraint → Tradeoff Analysis → Smart Decision Framework">
                            Capability → Constraint → Tradeoff Analysis → Smart Decision Framework
                        </option>

                        <option value="Workflow Snapshot → Bottleneck → AI Insertion Point → Compounding Leverage">
                            Workflow Snapshot → Bottleneck → AI Insertion Point → Compounding Leverage
                        </option>

                        <option value="Problem Pattern → Root Cause → System Redesign → Measurable Outcome">
                            Problem Pattern → Root Cause → System Redesign → Measurable Outcome
                        </option>

                        <option value="Industry Claim → Data Reality → Infrastructure View → Practical Implication">
                            Industry Claim → Data Reality → Infrastructure View → Practical Implication
                        </option>

                        <option value="Simple Question → Technical Layer → Economic Layer → Strategic Layer">
                            Simple Question → Technical Layer → Economic Layer → Strategic Layer
                        </option>

                        <option value="Before State → Breaking Point → Structural Correction → Sustainable Model">
                            Before State → Breaking Point → Structural Correction → Sustainable Model
                        </option>

                        <option value="Tool Usage → Misuse Pattern → Structural Fix → Compounding Benefit">
                            Tool Usage → Misuse Pattern → Structural Fix → Compounding Benefit
                        </option>

                        <option value="Feature → Architecture → Deployment → Long-Term Scalability">
                            Feature → Architecture → Deployment → Long-Term Scalability
                        </option>

                        <option value="Short-Term Win → Long-Term Risk → System Adjustment → Strategic Stability">
                            Short-Term Win → Long-Term Risk → System Adjustment → Strategic Stability
                        </option>

                        <option value="Raw Output → Evaluation Filter → Refinement System → Authority Result">
                            Raw Output → Evaluation Filter → Refinement System → Authority Result
                        </option>

                        <option value="Concept → Simplified Model → Real Example → Role-Based Application">
                            Concept → Simplified Model → Real Example → Role-Based Application
                        </option>

                        <option value="Hype Narrative → Cost Breakdown → Infrastructure Logic → Rational Adoption">
                            Hype Narrative → Cost Breakdown → Infrastructure Logic → Rational Adoption
                        </option>
                    </select>
                </div>

                <!-- Hook -->
                <div class="col-md-6">
                    <label class="form-label">Hook Type</label>
                    <select class="form-select"
                            th:field="*{hookType}">
                        <option value="Relatable productivity struggle">Relatable productivity struggle</option>
                        <option value="Tool overwhelm scenario">Tool overwhelm scenario</option>
                        <option value="Short bold tech truth">Short bold tech truth</option>
                        <option value="Practical question">Practical question</option>
                        <option value="Soft empathy hook">Soft empathy hook</option>
                        <option value="Mini real-world scenario">Mini real-world scenario</option>
                        <option value="Uncomfortable industry truth">Uncomfortable industry truth</option>

                        <option value="Hidden inefficiency exposure">Hidden inefficiency exposure</option>

                        <option value="Decision fatigue moment">Decision fatigue moment</option>

                        <option value="Late-night professional scenario">Late-night professional scenario</option>

                        <option value="Contrarian opening statement">Contrarian opening statement</option>

                        <option value="Everyone says X. But... contrast">Everyone says X. But... contrast</option>

                        <option value="Common misconception breakdown">Common misconception breakdown</option>

                        <option value="Overconfidence reality check">Overconfidence reality check</option>

                        <option value="Quiet operational failure">Quiet operational failure</option>

                        <option value="Behind-the-scenes workflow snapshot">Behind-the-scenes workflow snapshot</option>

                        <option value="Cost vs value tension moment">Cost vs value tension moment</option>

                        <option value="Technical confusion clarity hook">Technical confusion clarity hook</option>

                        <option value="Before-and-after professional contrast">Before-and-after professional contrast</option>

                        <option value="Mini crisis decision moment">Mini crisis decision moment</option>

                        <option value="Subtle frustration acknowledgement">Subtle frustration acknowledgement</option>

                        <option value="High-stakes strategic decision scenario">High-stakes strategic decision scenario</option>

                        <option value="Hidden complexity reveal">Hidden complexity reveal</option>

                        <option value="Surface trend vs deeper shift">Surface trend vs deeper shift</option>

                        <option value="Expectation vs operational reality">Expectation vs operational reality</option>

                        <option value="You think you are optimizing...">You think you are optimizing...</option>

                        <option value="Professional burnout signal">Professional burnout signal</option>

                        <option value="Strategic mistake spotlight">Strategic mistake spotlight</option>

                        <option value="Misused AI capability scenario">Misused AI capability scenario</option>

                        <option value="Workflow bottleneck exposure">Workflow bottleneck exposure</option>

                        <option value="System design flaw reveal">System design flaw reveal</option>
                    </select>
                </div>

                <!-- Publishing Day -->
                <div class="col-md-6">
                    <label class="form-label">Publishing Day</label>
                    <select class="form-select"
                            th:field="*{publishingDay}">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Target Roles</label>

                    <div class="card p-3 border">

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{targetRoles}"
                                   value="Managers"
                                   id="roleManagers">
                            <label class="form-check-label" for="roleManagers">
                                Managers
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{targetRoles}"
                                   value="Engineers"
                                   id="roleEngineers">
                            <label class="form-check-label" for="roleEngineers">
                                Engineers
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{targetRoles}"
                                   value="Students"
                                   id="roleStudents">
                            <label class="form-check-label" for="roleStudents">
                                Students
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{targetRoles}"
                                   value="Creators"
                                   id="roleCreators">
                            <label class="form-check-label" for="roleCreators">
                                Creators
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{targetRoles}"
                                   value="Non-Tech"
                                   id="roleNonTech">
                            <label class="form-check-label" for="roleNonTech">
                                Non-Tech
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{targetRoles}"
                                   value="SaaS Builders"
                                   id="roleSaaS">
                            <label class="form-check-label" for="roleSaaS">
                                SaaS Builders
                            </label>
                        </div>

                    </div>
                </div>

                <!-- Special Angle -->
                <div class="col-md-6">
                    <label class="form-label">Special Angle (Optional)</label>
                    <select class="form-select"
                            th:field="*{specialAngle}">

                        <option value="">-- None --</option>

                        <option value="Contrarian">Contrarian</option>
                        <option value="Tactical">Tactical</option>
                        <option value="Beginner-friendly">Beginner-friendly</option>
                        <option value="Intermediate-depth">Intermediate-depth</option>
                        <option value="Advanced-deep-dive">Advanced-deep-dive</option>
                        <option value="Comparison">Comparison</option>
                        <option value="Cost-focused">Cost-focused</option>
                        <option value="Architecture-focused">Architecture-focused</option>
                        <option value="Workflow-optimization">Workflow-optimization</option>
                        <option value="Strategic-decision">Strategic-decision</option>
                        <option value="Myth-busting">Myth-busting</option>
                        <option value="Operational-breakdown">Operational-breakdown</option>
                        <option value="Case-study-style">Case-study-style</option>
                        <option value="Founder-perspective">Founder-perspective</option>
                        <option value="Manager-lens">Manager-lens</option>
                        <option value="Engineer-lens">Engineer-lens</option>

                    </select>
                </div>

                <!-- Emotional Level -->
                <div class="col-md-6">
                    <label class="form-label">Emotional Level (1–5)</label>
                    <input type="range"
                           class="form-range"
                           min="1"
                           max="5"
                           th:field="*{emotionalLevel}">
                </div>

            </div>

            <div class="mt-4">
                <button type="submit"
                        class="btn btn-dark px-4">
                    Generate Prompt
                </button>
            </div>

        </form>

        <!-- OUTPUT -->
        <!-- Output Section -->
        <div th:if="${generatedPrompt != null}"
             class="card shadow-sm p-4 position-relative">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Generated Prompt</h5>

                <button type="button"
                        class="btn btn-sm btn-outline-dark"
                        onclick="copyPrompt()"
                        id="copyBtn">
                    📋 Copy
                </button>
            </div>

            <textarea class="form-control"
                      id="generatedPrompt"
                      rows="18"
                      readonly
                      th:text="${generatedPrompt}">
            </textarea>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function copyPrompt() {
        const textarea = document.getElementById("generatedPrompt");
        const button = document.getElementById("copyBtn");

        navigator.clipboard.writeText(textarea.value)
            .then(() => {
                button.innerText = "✅ Copied";
                button.classList.remove("btn-outline-dark");
                button.classList.add("btn-success");

                setTimeout(() => {
                    button.innerText = "📋 Copy";
                    button.classList.remove("btn-success");
                    button.classList.add("btn-outline-dark");
                }, 2000);
            })
            .catch(err => {
                alert("Copy failed. Please copy manually.");
            });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
