<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<aside th:fragment="adminSidebar"
       class="border-end bg-white"
       style="width:240px; min-height:100vh">

    <nav class="p-3">
        <br>
        <br>
        <br>
        <br>
        <br>
        <div class="fw-bold mb-4 fs-5">Admin Panel</div>

        <!-- 📊 Core -->
        <div class="text-muted small mb-2">CORE</div>

        <a th:href="@{/admin/dashboard}"
           class="nav-link mb-2"
           th:classappend="${currentPath.startsWith('/admin/dashboard')} ? 'active fw-bold' : ''">
            📊 Dashboard
        </a>

        <a th:href="@{/admin/posts}"
           class="nav-link mb-2"
           th:classappend="${currentPath.startsWith('/admin/posts')} ? 'active fw-bold' : ''">
            📄 Posts
        </a>

        <a th:href="@{/admin/posts/create}"
           class="nav-link mb-2"
           th:classappend="${currentPath == '/admin/posts/create'} ? 'active fw-bold' : ''">
            ✍️ Create Post
        </a>

        <a th:href="@{/admin/posts/guidelines}"
           class="nav-link mb-3"
           th:classappend="${currentPath.startsWith('/admin/posts/guidelines')} ? 'active fw-bold' : ''">
            📘 Creator Guidelines
        </a>

        <!-- 🛠 Utilities -->
        <div class="text-muted small mb-2 mt-3">UTILITIES</div>

        <a th:href="@{/admin/prompt-generator}"
           class="nav-link mb-2"
           th:classappend="${currentPath.startsWith('/admin/prompt-generator')} ? 'active fw-bold' : ''">
            🎛 Prompt Generator
        </a>

        <!-- 👤 User Management -->
        <div sec:authorize="hasRole('ADMIN')">
            <div class="text-muted small mb-2 mt-3">MANAGEMENT</div>

            <a th:href="@{/admin/users}"
               class="nav-link mb-2"
               th:classappend="${currentPath.startsWith('/admin/users')} ? 'active fw-bold' : ''">
                👤 Users
            </a>
        </div>

    </nav>
</aside>
</html>
