<nav class="breadcrumb-futorch" aria-label="Breadcrumb">

    <!-- Home -->
    <a th:href="@{/{lang}(lang=${lang})}">
        Home
    </a>

    <!-- Separator -->
    <span class="breadcrumb-sep">•</span>

    <!-- Category -->
    <a th:href="@{/{lang}/{cat}(
            lang=${lang},
            cat=${categorySlug}
        )}"
       th:text="${categoryName}">
        Category
    </a>

    <!-- Separator -->
    <span class="breadcrumb-sep">•</span>

    <!-- Current Page -->
    <span class="current"
          th:text="${pageTitle}">
        Title
    </span>

</nav>
<script type="application/ld+json" th:inline="javascript">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": /*[[${'https://futorch.com/' + lang}]]*/
            },
            {
                "@type": "ListItem",
                "position": 2,
                "name": /*[[${categoryName}]]*/,
                "item": /*[[${'https://futorch.com/' + lang + '/' + categorySlug}]]*/
            },
            {
                "@type": "ListItem",
                "position": 3,
                "name": /*[[${pageTitle}]]*/,
                "item": /*[[${'https://futorch.com/' + lang + '/' + categorySlug + '/' + postSlug}]]*/
            }
        ]
    }
</script>
