<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="hero"
         class="hero-section py-5">

    <div class="container">

        <!-- ================= TITLE ================= -->
        <h1 class="hero-title mb-3"
            th:text="${lang == 'kn'
                ? 'ಭವಿಷ್ಯದ ಬುದ್ಧಿವಂತ ಬೆಳವಣಿಗೆಗೆ ದಾರಿ.'
                : ' Lighting the Future of Intelligent Growth'}">
            Lighting the Future of Intelligent Growth
        </h1>

        <!-- ================= SUBTITLE ================= -->
        <p class="hero-subtitle"
           th:text="${lang == 'kn'
               ? 'AI, ತಂತ್ರಜ್ಞಾನ, ಹಣಕಾಸು ಮತ್ತು ವೃತ್ತಿಜೀವನದ ಬಗ್ಗೆ ನಿಖರವಾದ ಹಾಗೂ ಅರ್ಥಪೂರ್ಣ ಲೇಖನಗಳು — ಅಪ್ರಯೋಜಕ ಶಬ್ದವಿಲ್ಲದೆ.'
               : 'Deep insights on AI, tech, finance, and modern careers — built for ambitious minds.'}">
            Deep insights on AI, tech, finance, and modern careers — built for ambitious minds.
        </p>
    </div>

</section>

</body>
</html>
