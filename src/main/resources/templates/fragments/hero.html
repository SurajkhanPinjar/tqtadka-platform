<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="hero"
         class="hero-section py-5">

    <div class="container">

        <!-- ================= TITLE ================= -->
        <h1 class="hero-title mb-3"
            th:text="${lang == 'kn'
                ? 'ಭವಿಷ್ಯದ ಬುದ್ಧಿವಂತ ಬೆಳವಣಿಗೆಗೆ ದಾರಿ.'
                : 'AI Intelligence for Modern Builders'}">
            AI Intelligence for Modern Builders
        </h1>

        <!-- ================= SUBTITLE ================= -->
        <p class="hero-subtitle"
           th:text="${lang == 'kn'
               ? 'AI, ತಂತ್ರಜ್ಞಾನ, ಹಣಕಾಸು ಮತ್ತು ವೃತ್ತಿಜೀವನದ ಬಗ್ಗೆ ನಿಖರವಾದ ಹಾಗೂ ಅರ್ಥಪೂರ್ಣ ಲೇಖನಗಳು — ಅಪ್ರಯೋಜಕ ಶಬ್ದವಿಲ್ಲದೆ.'
               : 'Learn AI skills, tools, and career systems that compound long-term advantage.'}">
            Learn AI skills, tools, and career systems that compound long-term advantage.
        </p>
    </div>

</section>

</body>
</html>
