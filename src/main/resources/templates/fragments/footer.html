            <!-- Explore -->
            <div class="footer-column">

            <!-- Categories -->
            <div class="footer-column">

                <div class="footer-column-title">Categories</div>

                <a class="footer-link"

                <a class="footer-link"
                   th:href="@{/{lang}/social-media(lang=${lang})}">

                <a class="footer-link"
                   th:href="@{/{lang}/jobs(lang=${lang})}">

                <a class="footer-link"

                <a class="footer-link"

                </a>

                   th:href="@{/{lang}/disclaimer(lang=${lang})}">
                    Disclaimer

        <span>
